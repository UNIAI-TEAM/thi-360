name: iOS

on:
  push:
    branches: [develop, integration/app-hoc-vien]
    paths: ["apps/ios/**", "contracts/mobile/**", ".github/workflows/ios.yml"]
  pull_request:
    branches: [develop, integration/app-hoc-vien]
    paths: ["apps/ios/**", "contracts/mobile/**", ".github/workflows/ios.yml"]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select available iOS Simulator
        id: sim
        run: |
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          candidates = []
          for runtime, devices in data.items():
              if "SimRuntime.iOS-" not in runtime:
                  continue
              for d in devices:
                  if d.get("isAvailable") and d.get("name", "").startswith("iPhone"):
                      candidates.append((runtime, d["name"], d["udid"]))
          preferred = ["iPhone 17", "iPhone 16", "iPhone 16 Pro", "iPhone 15"]
          for name in preferred:
              matches = [c for c in candidates if c[1] == name]
              if matches:
                  print(sorted(matches, reverse=True)[0][2])
                  sys.exit(0)
          if not candidates:
              sys.exit("No available iPhone simulator found")
          print(sorted(candidates, reverse=True)[0][2])
          ')
          echo "udid=$SIM_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$SIM_ID" || true

      - name: Build Thi360Demo (simulator)
        run: |
          xcodebuild -project Thi360.xcodeproj \
            -scheme Thi360Demo \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            build

      - name: Run Thi360Demo ATS, config, and log redaction unit tests
        run: |
          xcodebuild -project Thi360.xcodeproj \
            -scheme Thi360Demo \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -skipPackagePluginValidation \
            test \
            -only-testing:Thi360Tests/TransportSecurityTests \
            -only-testing:Thi360Tests/EnvironmentConfigTests \
            -only-testing:Thi360Tests/LogRedactionTests

      - name: Run Thi360Dev unit and UI tests
        run: |
          xcodebuild -project Thi360.xcodeproj \
            -scheme Thi360Dev \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -skipPackagePluginValidation \
            test
