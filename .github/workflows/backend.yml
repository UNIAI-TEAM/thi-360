name: Backend

on:
  push:
    branches: [develop]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    branches: [develop]
    paths: ["backend/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B -ntp verify
      - run: diff -u ../packages/api-client/openapi.json target/openapi.json
