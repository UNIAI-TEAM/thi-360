name: E2E

on:
  push:
    branches: [develop]
    paths:
      - "backend/**"
      - "apps/**"
      - "packages/**"
      - "e2e/**"
      - "infra/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/e2e.yml"
  pull_request:
    branches: [develop]
    paths:
      - "backend/**"
      - "apps/**"
      - "packages/**"
      - "e2e/**"
      - "infra/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/e2e.yml"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @thi360/e2e exec playwright install --with-deps chromium
      - name: Start Compose dev services
        run: |
          docker compose -f infra/docker-compose.yml up -d
          init_cid="$(docker compose -f infra/docker-compose.yml ps -a -q keycloak-init)"
          if [ -z "$init_cid" ] || [ "$(docker wait "$init_cid")" != "0" ]; then
            docker compose -f infra/docker-compose.yml logs keycloak-init || true
            docker compose -f infra/docker-compose.yml ps
            exit 1
          fi
          docker compose -f infra/docker-compose.yml ps
      - name: Build backend and webs
        run: |
          cd backend && ./mvnw -B -ntp package -DskipTests && cd ..
          pnpm --filter @thi360/web-student --filter @thi360/web-admin build
      - name: Run Playwright E2E
        env:
          E2E_BACKEND_CMD: java -jar target/thi360-backend-0.1.0-SNAPSHOT.jar --spring.profiles.active=api,worker,dev,e2e
          E2E_USE_BUILT: "1"
          THI360_S3_ENDPOINT: "http://localhost:9360"
          # Passed through playwright.config.ts to the spawned backend: raises
          # the per-IP login rate limit (thi360.security.rate-limit.login-per-ip-limit)
          # so the suite's platform logins cannot trip RateLimitFilter.
          THI360_SECURITY_RATELIMIT_LOGINPERIPLIMIT: "200"
          # Same path for the per-IP register limits (E19: 30/hour, 100/day) and forgot/reset limits (E16: 60/min):
          # the account-* specs create a fresh account per test.
          THI360_REGISTER_IP_HOUR_LIMIT: "1000"
          THI360_REGISTER_IP_DAY_LIMIT: "5000"
          THI360_FORGOT_PER_IP_LIMIT: "600"
          THI360_RESET_PER_IP_LIMIT: "600"
          # Same path for the per-user live-session cap
          # (thi360.security.session.max-per-user, default 5): the suite logs
          # `platform` in more times than that and the oldest session is evicted.
          THI360_SECURITY_SESSION_MAXPERUSER: "50"
        run: pnpm --filter @thi360/e2e test --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: e2e/playwright-report/
          retention-days: 7
      - name: Stop Compose dev services
        if: always()
        run: docker compose -f infra/docker-compose.yml down
