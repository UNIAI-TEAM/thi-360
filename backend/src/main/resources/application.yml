spring:
  application:
    name: thi360-api
  servlet:
    multipart:
      max-file-size: 21MB
      max-request-size: 22MB
  datasource:
    url: ${THI360_DB_URL:jdbc:postgresql://localhost:${THI360_DB_PORT:54360}/${THI360_DB_NAME:thi360}}
    username: ${THI360_DB_USER:thi360}
    password: ${THI360_DB_PASSWORD:thi360-dev-only}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: shared
  flyway:
    enabled: true
    default-schema: shared
    schemas:
      - shared
      - identity
      - catalog
      - audit
      - classroom
      - questionbank
      - exam
      - commerce
      - attempt
    table: flyway_schema_history
    locations:
      - classpath:db/migration
    placeholders:
      auditAppRole: ${THI360_AUDIT_APP_ROLE:${spring.datasource.username}}
  data:
    redis:
      host: ${THI360_REDIS_HOST:localhost}
      port: ${THI360_REDIS_PORT:63790}
      repositories:
        enabled: false
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
    default-locale: vi
  mail:
    host: ${THI360_SMTP_HOST:localhost}
    port: ${THI360_SMTP_PORT:1360}
    username: ${THI360_SMTP_USERNAME:}
    password: ${THI360_SMTP_PASSWORD:}
  thymeleaf:
    check-template-location: false

server:
  port: ${THI360_API_PORT:8080}
  forward-headers-strategy: NATIVE
  tomcat:
    # Không swallow body vượt giới hạn thay vì cắt kết nối: multipart 413 trả về đúng JSON lỗi.
    max-swallow-size: -1

# Log: bố cục và mức log nằm ở logback-spring.xml. Dòng dưới thêm tên dịch vụ vào mỗi bản ghi JSON.
logging:
  structured:
    json:
      add:
        service: ${spring.application.name}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs

thi360:
  keycloak:
    url: ${THI360_KC_URL:http://localhost:${THI360_KC_PORT:8360}}
    realm: ${THI360_KC_REALM:}
    client-id: ${THI360_KC_CLIENT_ID:thi360-api}
    client-secret: ${THI360_KC_CLIENT_SECRET:thi360-api-dev-only}
    platform-realm: ${THI360_KC_PLATFORM_REALM:master}
    platform-role: ${THI360_KC_PLATFORM_ROLE:PLATFORM_ADMIN}
    platform-client-id: ${THI360_KC_PLATFORM_CLIENT_ID:thi360-platform}
    platform-client-secret: ${THI360_KC_PLATFORM_CLIENT_SECRET:thi360-platform-dev-only}
  web-url: ${THI360_WEB_URL:http://localhost:3000}
  admin-url: ${THI360_ADMIN_URL:http://localhost:3001}
  redirect-allowed-origins: []
  cookie:
    domain: ${THI360_COOKIE_DOMAIN:}
    secure: ${THI360_COOKIE_SECURE:true}
  ctx:
    secret: ${THI360_CTX_SECRET:}
    ttl: PT5M
  security:
    admin-origins:
      - ${THI360_ADMIN_URL:http://localhost:3001}
    trusted-proxies: ${THI360_TRUSTED_PROXIES:127.0.0.1,::1,172.16.0.0/12}
    rate-limit:
      # E19: mỗi IP tối đa 30 lần đăng ký mỗi giờ và 100 lần mỗi ngày (ngày = 24 giờ trượt, câu hỏi mở 2 của ID-1).
      register-per-ip-hour-limit: ${THI360_REGISTER_IP_HOUR_LIMIT:30}
      register-per-ip-hour-window: PT1H
      register-per-ip-day-limit: ${THI360_REGISTER_IP_DAY_LIMIT:100}
      register-per-ip-day-window: PT24H
      # E16, TM 13: forgot theo IP; reset cùng ngưỡng 60 lần mỗi phút (quyết định tạm của plan ID-2).
      forgot-per-ip-limit: ${THI360_FORGOT_PER_IP_LIMIT:60}
      forgot-per-ip-window: PT1M
      reset-per-ip-limit: ${THI360_RESET_PER_IP_LIMIT:60}
      reset-per-ip-window: PT1M
      # CM-1 (TM 10.2): GET /api/v1/public/** gets 120 requests per minute per IP. exempt-ips lists the web servers that render
      # the public pages from one IP (comma separated IPs or CIDRs, plan B6); empty means nobody is exempt.
      public-per-ip-limit: 120
      public-per-ip-window: PT1M
      exempt-ips: ${THI360_SECURITY_RATELIMIT_EXEMPTIPS:}
  s3:
    mode: ${THI360_S3_MODE:s3}
    endpoint: ${THI360_S3_ENDPOINT:http://localhost:${THI360_S3_PORT:9360}}
    bucket: ${THI360_S3_BUCKET:thi360-private}
    access-key: ${THI360_S3_ACCESS_KEY:}
    secret-key: ${THI360_S3_SECRET_KEY:}
    region: ${THI360_S3_REGION:us-east-1}
    auto-create-bucket: ${THI360_S3_AUTO_CREATE_BUCKET:false}
  file:
    enc-key: ${THI360_FILE_ENC_KEY:}
  outbox:
    scheduling:
      enabled: true
  audit:
    archive-after-quarters: ${THI360_AUDIT_ARCHIVE_AFTER_QUARTERS:8}
  identity:
    reserved-usernames: ${THI360_RESERVED_USERNAMES:admin,administrator,root,system,support,platform,thi360,null,undefined}
    provisioning-reconcile:
      scheduling:
        enabled: true
    import-batch:
      scheduling:
        enabled: true
      lease-duration: PT5M
      retry-delay: PT5S
      max-attempts: 3
    password-reset:
      # E16: hạn mã 1 giờ; mỗi tài khoản 1 lần mỗi 60 giây và 5 lần trong 24 giờ trượt.
      token-ttl: ${THI360_PASSWORD_RESET_TTL:PT1H}
      account-cooldown: ${THI360_PASSWORD_RESET_COOLDOWN:PT1M}
      account-daily-limit: ${THI360_PASSWORD_RESET_DAILY_LIMIT:5}
      account-daily-window: ${THI360_PASSWORD_RESET_DAILY_WINDOW:PT24H}
      # Job đối soát: lần ghi mật khẩu có dấu ghi trước mà chưa hoàn tất sau thời gian này bị coi là chưa xác định.
      write-reconcile-grace: ${THI360_PASSWORD_RESET_RECONCILE_GRACE:PT5M}
  questionbank:
    import:
      max-file-bytes: 5242880
      max-rows: 2000
    scheduling:
      enabled: true
    assets:
      # BE-2b (spec 4.2, plan B5): cỡ tệp theo loại; multipart chung 21/22 MB vẫn chặn trước.
      max-image-size: ${THI360_QB_ASSET_IMAGE_MAX:5MB}
      max-attachment-size: ${THI360_QB_ASSET_ATTACHMENT_MAX:20MB}
      # Giới hạn tần suất tải lên theo người (quyết định 8.1): 60 tệp / 10 phút → 429.
      upload-per-user-limit: ${THI360_QB_ASSET_RATE_LIMIT:60}
      upload-per-user-window: ${THI360_QB_ASSET_RATE_WINDOW:PT10M}
      # Tiền tố khóa trong bucket riêng tư dùng chung (quyết định 8.2).
      key-prefix: ${THI360_QB_ASSET_KEY_PREFIX:questions/}
      cleanup:
        scheduling:
          enabled: true
  exam:
    structure:
      max-topic-quotas: ${THI360_EXAM_MAX_TOPIC_QUOTAS:8}
      max-mapid-rules: ${THI360_EXAM_MAX_MAPID_RULES:20}
    listing:
      # Giá bán thấp nhất khi công bố bài thi; cùng biến với mức tối thiểu của VNPAY (TM E26).
      min-price-vnd: ${THI360_VNPAY_MIN_AMOUNT:5000}
    cover-cleanup:
      orphan-age: P7D
      interval: PT24H
      batch-size: 100
    solver:
      generate:
        # LT F5: deadline of paper generation, separate from the check/preview limits (thi360.exam.solver.*).
        deadline: ${THI360_EXAM_SOLVER_GENERATE_DEADLINE:30s}
  attempt:
    generation:
      threads: ${THI360_ATTEMPT_GEN_THREADS:4}
      queue-capacity: ${THI360_ATTEMPT_GEN_QUEUE_CAPACITY:32}
      max-queue-wait: ${THI360_ATTEMPT_GEN_MAX_QUEUE_WAIT:PT60S}
      stale-starting-after: ${THI360_ATTEMPT_STALE_STARTING_AFTER:PT2M}
    scheduling:
      enabled: true
      stale-starting-interval-ms: 30000
  mail:
    from: ${THI360_MAIL_FROM:Thi 360 <no-reply@thi360.local>}
    tls: ${THI360_SMTP_TLS:starttls}
  token:
    # Pepper của HMAC mã OTP và mã đặt lại mật khẩu (plan B6). Thiếu thì ứng dụng không khởi động.
    pepper: ${THI360_TOKEN_PEPPER:}
  avatar:
    # E20: bucket riêng cho ảnh đại diện (cùng endpoint và khóa với thi360.s3); tạo bucket ở môi trường triển khai.
    bucket: ${THI360_AVATAR_BUCKET:thi360-avatars}
  commerce:
    vnpay-min-amount: ${THI360_VNPAY_MIN_AMOUNT:5000}
    scheduling:
      enabled: true
    fulfillment-retry:
      interval: PT1M
    order:
      expire-duration: PT15M
    voucher:
      quote-per-user-minute-limit: ${THI360_VOUCHER_QUOTE_MINUTE_LIMIT:10}
      quote-per-user-minute-window: PT1M
      quote-per-user-day-limit: ${THI360_VOUCHER_QUOTE_DAY_LIMIT:50}
      quote-per-user-day-window: PT24H
  vnpay:
    mode: ${THI360_VNPAY_MODE:}
    tmn-code: ${THI360_VNPAY_TMN_CODE:}
    hash-secret: ${THI360_VNPAY_HASH_SECRET:}
    pay-url: ${THI360_VNPAY_PAY_URL:}
    api-url: ${THI360_VNPAY_API_URL:}
    ipn-allowed-ips: ${THI360_VNPAY_IPN_ALLOWED_IPS:}
---
spring:
  config:
    activate:
      on-profile: worker & !api
  main:
    web-application-type: none

---
spring:
  config:
    activate:
      on-profile: api
  main:
    web-application-type: servlet

---
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    # hotfix migrations from develop may sort below wave migrations already applied on local/lane DBs
    out-of-order: true
    fail-on-missing-locations: false
    locations:
      - classpath:db/migration
      - classpath:db/devdata

thi360:
  devdata.published-exams.enabled: true
  keycloak:
    realm: ${THI360_KC_REALM:thi-360}
  ctx:
    secret: ${THI360_CTX_SECRET:ctx-dev-only-change-me-32-bytes!!}
  cookie:
    secure: ${THI360_COOKIE_SECURE:false}
  s3:
    access-key: ${THI360_S3_ACCESS_KEY:thi360}
    secret-key: ${THI360_S3_SECRET_KEY:thi360-dev-only}
    auto-create-bucket: ${THI360_S3_AUTO_CREATE_BUCKET:true}
  file:
    enc-key: ${THI360_FILE_ENC_KEY:dGhpMzYwLWRldi1vbmx5LWFlcy0yNTYta2V5LTAwMDA=}
  mail:
    tls: ${THI360_SMTP_TLS:none}
  token:
    pepper: ${THI360_TOKEN_PEPPER:dev-only-token-pepper-do-not-use}
  identity:
    # TM 5.3: mã OTP cố định, chỉ ở profile dev. DevEmailCodeGuard chặn biến này ở profile khác.
    email-code:
      dev-code: ${THI360_DEV_EMAIL_CODE:}
  vnpay:
    mode: ${THI360_VNPAY_MODE:MOCK}
    mock-secret: dev-only-mock-vnpay-signing-key
    mock-tmn-code: DEV-MOCK
---
spring:
  config:
    activate:
      on-profile: test
  flyway:
    # hotfix migrations from develop may sort below wave migrations already applied on local/lane DBs
    out-of-order: true
    fail-on-missing-locations: false
    locations:
      - classpath:db/migration
      - classpath:db/devdata

thi360:
  keycloak:
    realm: ${THI360_KC_REALM:thi-360}
  ctx:
    secret: ${THI360_CTX_SECRET:ctx-dev-only-change-me-32-bytes!!}
  outbox:
    scheduling:
      enabled: false
  identity:
    provisioning-reconcile:
      scheduling:
        enabled: false
    import-batch:
      scheduling:
        enabled: false
    password-reset:
      revocation-retry:
        scheduling:
          enabled: false
  s3:
    access-key: ${THI360_S3_ACCESS_KEY:thi360}
    secret-key: ${THI360_S3_SECRET_KEY:thi360-dev-only}
    auto-create-bucket: ${THI360_S3_AUTO_CREATE_BUCKET:true}
  file:
    enc-key: ${THI360_FILE_ENC_KEY:dGhpMzYwLWRldi1vbmx5LWFlcy0yNTYta2V5LTAwMDA=}
  cookie:
    secure: ${THI360_COOKIE_SECURE:false}
  questionbank:
    scheduling:
      enabled: false
    assets:
      cleanup:
        scheduling:
          enabled: false
  exam:
    scheduling:
      enabled: false
  attempt:
    scheduling:
      enabled: false
  mail:
    tls: ${THI360_SMTP_TLS:none}
    scheduling:
      enabled: false
  token:
    pepper: ${THI360_TOKEN_PEPPER:dev-only-token-pepper-do-not-use}
  commerce:
    scheduling:
      enabled: false
  vnpay:
    mode: ${THI360_VNPAY_MODE:MOCK}
    mock-secret: dev-only-mock-vnpay-signing-key
    mock-tmn-code: DEV-MOCK
---
spring:
  config:
    activate:
      on-profile: openapi
  main:
    web-application-type: servlet
---
spring:
  config:
    activate:
      on-profile: e2e
  flyway:
    fail-on-missing-locations: false
    locations:
      - classpath:db/migration
      - classpath:db/devdata

# C-0b: giá trị công khai, chỉ dùng cho E2E trên CI và máy dev (plan B6); bản demo dùng giá trị riêng trong .env.
# Cùng khóa thi360.token.pepper với TokenPepperProperties (C-0).
thi360:
  devdata.published-exams.enabled: true
  token:
    pepper: ${THI360_TOKEN_PEPPER:dev-only-e2e-token-pepper-not-a-secret}
  mail:
    tls: ${THI360_SMTP_TLS:none}
  vnpay:
    mode: ${THI360_VNPAY_MODE:MOCK}
    mock-secret: dev-only-mock-vnpay-signing-key
    mock-tmn-code: DEV-MOCK
