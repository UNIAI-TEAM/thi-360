<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi" th:fragment="shell(content)">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${mailSubject}">[[${productName}]]</title>
</head>
<body style="margin:0;padding:0;background-color:#F7F8F9;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F7F8F9;">
    <tr>
        <td align="center" style="padding:24px 12px;">
            <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0"
                   style="width:100%;max-width:560px;background-color:#FFFFFF;border:1px solid #E8E8EC;border-radius:12px;">
                <tr>
                    <td style="background-color:#065F46;padding:20px 28px;border-radius:12px 12px 0 0;font-family:'Be Vietnam Pro',system-ui,sans-serif;font-size:20px;line-height:28px;font-weight:700;color:#FFFFFF;">
                        [[${productName}]]
                    </td>
                </tr>
                <tr>
                    <td style="padding:28px;font-family:'Be Vietnam Pro',system-ui,sans-serif;font-size:14px;line-height:21px;color:#11181C;">
                        <div th:replace="${content}">Nội dung thư</div>
                    </td>
                </tr>
                <tr>
                    <td style="padding:16px 28px;border-top:1px solid #E8E8EC;font-family:'Be Vietnam Pro',system-ui,sans-serif;font-size:12.5px;line-height:19px;color:#6B6B72;">
                        Đây là thư tự động từ [[${productName}]]. Vui lòng không trả lời thư này.<br>
                        <a th:href="${webUrl}" th:text="${webUrl}" style="color:#047857;">thi360.vn</a>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
