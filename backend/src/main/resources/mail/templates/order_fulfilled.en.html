<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout.en.html :: shell(~{::#mail-body})}">
<body>
<div id="mail-body">
    <p style="margin:0 0 16px 0;">Hello <span th:text="${fullName}">Alex Nguyen</span>,</p>
    <p style="margin:0 0 12px 0;">Order <strong th:text="${orderCode}">DH-0001</strong> was paid successfully and you now have access to:</p>
    <ul style="margin:0 0 20px 0;padding:0 0 0 20px;">
        <li th:each="item : ${items}" th:text="${item['name']}" style="margin:0 0 6px 0;">Exam name</li>
    </ul>
    <p style="margin:0;">
        <a th:href="${webUrl + '/home'}"
           style="display:inline-block;background-color:#047857;color:#FFFFFF;text-decoration:none;font-weight:600;font-size:14px;line-height:20px;padding:10px 20px;border-radius:10px;">My exams</a>
    </p>
</div>
</body>
</html>
