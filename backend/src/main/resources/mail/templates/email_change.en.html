<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout.en.html :: shell(~{::#mail-body})}">
<body>
<div id="mail-body">
    <p style="margin:0 0 16px 0;">Hello <span th:text="${fullName}">Alex Nguyen</span>,</p>
    <p style="margin:0 0 16px 0;">You asked to change your account email to
        <strong th:text="${newEmail}">new.email@example.test</strong>. Your confirmation code is:</p>
    <p style="margin:0 0 16px 0;padding:14px 20px;background-color:#ECFDF5;border:1px solid #A7E3C2;border-radius:10px;font-size:28px;line-height:36px;font-weight:700;letter-spacing:6px;color:#065F46;text-align:center;"
       th:text="${code}">123456</p>
    <p style="margin:0;color:#6B6B72;">The code is only valid for a short time. If you did not ask for this change, please ignore this message; your current email stays as it is.</p>
</div>
</body>
</html>
