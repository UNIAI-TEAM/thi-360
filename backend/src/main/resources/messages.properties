VALIDATION_FAILED=Dữ liệu không hợp lệ
UNAUTHENTICATED=Chưa xác thực hoặc phiên đăng nhập đã hết hạn
FORBIDDEN=Không có quyền thực hiện thao tác này
NOT_FOUND=Không tìm thấy dữ liệu yêu cầu
CONFLICT=Xung đột dữ liệu nghiệp vụ
VERSION_CONFLICT=Dữ liệu đã được cập nhật bởi người khác, vui lòng tải lại
RATE_LIMITED=Gửi yêu cầu quá nhanh, vui lòng thử lại sau
INTERNAL_ERROR=Đã xảy ra lỗi hệ thống, vui lòng thử lại sau
INVALID_CREDENTIALS=Tên đăng nhập hoặc mật khẩu không đúng
ACCOUNT_INACTIVE=Tài khoản đã ngừng hoạt động
LOGIN_THROTTLED=Đăng nhập sai quá nhiều lần, vui lòng thử lại sau
PASSWORD_WEAK=Mật khẩu không đạt yêu cầu bảo mật
WRONG_OLD_PASSWORD=Mật khẩu hiện tại không đúng
CSRF_INVALID=Yêu cầu không hợp lệ do thiếu hoặc sai mã xác thực CSRF
ORIGIN_INVALID=Nguồn gốc yêu cầu không được phép
SESSION_REVOKED=Phiên đăng nhập đã hết hiệu lực hoặc bị thu hồi
IDENTITY_PROVIDER_ERROR=Không thể kết nối dịch vụ xác thực, vui lòng thử lại sau
USERNAME_TAKEN=Tên đăng nhập đã tồn tại
