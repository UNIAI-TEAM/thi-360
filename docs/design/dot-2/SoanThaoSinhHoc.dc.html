<span aria-hidden="true" style="flex: none; font-size: 16px">×</span><select aria-label="Giới tính bên thứ hai" style="height: 40px; box-sizing: border-box; padding: 0 8px; border: 1px solid #E8E8EC; border-radius: 10px; font: inherit; color: #11181C; background: #FFFFFF"><option>♀</option></select><input type="text" aria-label="Kiểu gen bên thứ hai" value="aabb" placeholder="" style="flex: 1 1 0; min-width: 0; height: 40px; box-sizing: border-box; padding: 0 12px; border: 1px solid #E8E8EC; border-radius: 10px; font: inherit; color: #11181C; background: #FFFFFF"></div><div style="display: flex; align-items: center; gap: 10px"><strong style="width: 36px; flex: none; font-weight: 600">G</strong><input type="text" aria-label="Giao tử bên thứ nhất" value="AB, Ab, aB, ab" placeholder="" style="flex: 1 1 0; min-width: 0; height: 40px; box-sizing: border-box; padding: 0 12px; border: 1px solid #E8E8EC; border-radius: 10px; font: inherit; color: #11181C; background: #FFFFFF"><input type="text" aria-label="Giao tử bên thứ hai" value="ab" placeholder="" style="flex: 1 1 0; min-width: 0; height: 40px; box-sizing: border-box; padding: 0 12px; border: 1px solid #E8E8EC; border-radius: 10px; font: inherit; color: #11181C; background: #FFFFFF"></div><div style="display: flex; align-items: center; gap: 10px"><strong style="width: 36px; flex: none; font-weight: 600">F<sub>1</sub></strong><input type="text" aria-label="Tỉ lệ kiểu gen F1" value="1 AaBb : 1 Aabb : 1 aaBb : 1 aabb" placeholder="" style="flex: 1 1 0; min-width: 0; height: 40px; box-sizing: border-box; padding: 0 12px; border: 1px solid #E8E8EC; border-radius: 10px; font: inherit; color: #11181C; background: #FFFFFF"></div><div style="display: flex; align-items: center; gap: 10px"><strong style="width: 36px; flex: none; font-weight: 600"></strong><input type="text" aria-label="Tỉ lệ kiểu hình F1" value="" placeholder="Tỉ lệ kiểu hình (không bắt buộc)" style="flex: 1 1 0; min-width: 0; height: 40px; box-sizing: border-box
