<section aria-labelledby="q-title" style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; background: #FFFFFF; border: 1px solid #E8E8EC; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 20px"><div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px"><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px"><h1 id="q-title" style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 700">Câu 19</h1><span style="display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 9999px; font-size: 12.5px; font-weight: 500; white-space: nowrap; background: #ECFDF5; color: #047857">Chọn một đáp án</span></div><button type="button" aria-pressed="false" style="height: 44px; padding: 0 14px; border-radius: 12px; font: inherit; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; border: 1px solid #E8E8EC; background: #FFFFFF; color: #3A3A42"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1zM4 22v-7"></path></svg>Đánh dấu xem lại</button></div><div style="display: flex; flex-direction: column; gap: 14px; font-size: 16px; line-height: 26px"><div>Tính giới hạn <span style="font-family: 'Cambria Math', 'Times New Roman', serif; font-size: 1.12em"><span style="display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1.1; margin-right: 4px"><span>lim</span><span style="font-size: 0.72em"><i>x</i> → 1</span></span><span style="display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1.25; margin: 0 3px"><span style="padding: 0 4px; border-bottom: 1px solid currentColor">2<i>x</i> − √<span style="border-top: 1p -flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1.25; margin: 0 3px"><span style="padding: 0 4px; border-bottom: 1px solid currentColor">5</span><span style="padding: 0 4px">8</span></span></span></span></label><label style="display: flex; align-items: center; gap: 12px; min-height: 52px; box-sizing: border-box; padding: 10px 14px; border: 1px solid #E8E8EC; border-radius: 12px; background: #FFFFFF; cursor: pointer"><input type="radio" name="exo" style="width: 18px; height: 18px; margin: 0; flex: none; accent-color: #059669"><strong style="font-weight: 600">D.</strong><span style="min-width: 0"><span style="font-family: 'Cambria Math', 'Times New Roman', serif; font-size: 1.12em">2</span></span></label></div></div><div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; padding-top: 16px; border-top: 1px solid #E8E8EC"><button type="button" style="height: 44px; padding: 0 14px; border-radius: 12px; font: inherit; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; border: 1px solid #E8E8EC; background: #FFFFFF; color: #3A3A42"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>Câu trước</button><button type="button" style="height: 44px; padding: 0 14px; border-radius: 12px; font: inherit; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; border: 0; background: #059669; color: #FFFFFF">Câu sau<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"></path></svg></button></div></section>
<aside aria-labelledby="pal-title" style="flex: 1 1 280px; max-width: 340px; min-width: 0; box-sizing: border-box; background: #FFFFFF; border: 1px solid #E8E8EC; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
<div>
<h2 id="pal-title" style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 600">Danh sách câu hỏi</h2>
<div style="color: #54545A">18/50 câu đã trả lời</div>
</div>
<div aria-hidden="true" style="height: 8px; border-radius: 9999px; background: #F1F2F4; overflow: hidden"><div style="width: 36%; height: 8px; background: #059669"></div></div>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{cells}}" as="c" hint-placeholder-count="50"><button type="button" aria-label="{{c.label}}" style="{{c.style}}">{{c.n}}</button></sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; font-size: 12.5px; line-height: 19px; color: #3A3A42">
<div style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 16px; height: 16px; flex: none; box-sizing: border-box; border-radius: 5px; background: #059669"></span>Đang làm</div>
<div style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 16px; height: 16px; flex: none; box-sizing: border-box; border-radius: 5px; background: #ECFDF5; border: 1px solid #A7E3C2"></span>Đã trả lời</div>
<div style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 16px; height: 16px; flex: none; box-sizing: border-box; border-radius: 5px; background: #FFFBEB; border: 2px dashed #B45309"></span>Đánh dấu xem lại</div>
<div style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 16px; height: 16px; flex: none; box-sizing: border-box; border-radius: 5px; background: #FFFFFF; border: 1px solid #D4D4D8"></span>Chưa trả lời</div>
</div>
</aside>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const cur = [19], flagged = [7, 15], skipped = [9];
const base = 'height: 44px; padding: 0; border-radius: 10px; font: inherit; font-weight: 600; font-variant-numeric: tabular-nums; cursor: pointer; ';
const cells = [];
for (let i = 1; i <= 50; i++) {
let st = 'border: 1px solid #E8E8EC; background: #FFFFFF; color: #3A3A42';
let label = 'Câu ' + i + ', chưa trả lời';
if (i < cur[0] && !skipped.includes(i)) { st = 'border: 1px solid #A7E3C2; background: #ECFDF5; color: #047857'; label = 'Câu ' + i + ', đã trả lời'; }
if (flagged.includes(i)) { st = 'border: 2px dashed #B45309; background: #FFFBEB; color: #B45309'; label = 'Câu ' + i + ', đã đánh dấu xem lại'; }
if (cur.includes(i)) { st = 'border: 1px solid #059669; background: #059669; color: #FFFFFF'; label = 'Câu ' + i + ', đang làm'; }
cells.push({ n: i, style: base + st, label: label });
}
return { cells: cells };
}
}
</script>
