<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Điện thoại: danh sách câu hỏi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#047857}a:hover{color:#065F46}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #6B7280; font-family: 'Be Vietnam Pro', system-ui, sans-serif; font-size: 14px; line-height: 21px; color: #11181C; display: flex; flex-direction: column; justify-content: flex-end"><div role="dialog" aria-modal="true" aria-labelledby="sh-title" style="background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 10px 16px 24px; display: flex; flex-direction: column; gap: 12px"><div aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 9999px; background: #D4D4D8"></div><div style="display: flex; align-items: center; justify-content: space-between; gap: 8px"><div><h1 id="sh-title" style="margin: 0; font-size: 18px; line-height: 26px; font-weight: 700">Danh sách câu hỏi</h1><div style="color: #54545A">18/50 câu đã trả lời</div></div><button type="button" aria-label="Đóng danh sách" style="flex: none; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: #3A3A42; cursor: pointer; display: inline-flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></div><div aria-hidden="true" style="height: 8px; border-radius: 9999px; background: #F1F2F4; overflow: hidden"><div style="width: 36%; height: 8px; background: #059669"></div></div><div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px"><sc-for list="{{cells}}" as="c" hint-placeholder-count="50"><button type="button" aria-label="{{c.label}}" style="{{c.style}}">{{c.n}}</button></sc-for></div><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; font-size: 12.5px; line-height: 19px; color: #3A3A42"><div style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 16px; height: 16px; flex: none; box-sizing: border-box; border-radius: 5px; background: #059669"></span>Đang làm</div><div style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 16px; height: 16px; flex: none; box-sizing: border-box; border-radius: 5px; background: #ECFDF5; border: 1px solid #A7E3C2"></span>Đã trả lời</div><div style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 16px; height: 16px; flex: none; box-sizing: border-box; border-radius: 5px; background: #FFFBEB; border: 2px dashed #B45309"></span>Đánh dấu xem lại</div><div style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 16px; height: 16px; flex: none; box-sizing: border-box; border-radius: 5px; background: #FFFFFF; border: 1px solid #D4D4D8"></span>Chưa trả lời</div></div></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const cur = [19], flagged = [7, 15], skipped = [9];
const base = 'height: 44px; padding: 0; border-radius: 10px; font: inherit; font-weight: 600; font-variant-numeric: tabular-nums; cursor: pointer; ';
const cells = [];
for (let i = 1; i <= 50; i++) {
let st = 'border: 1px solid #E8E8EC; background: #FFFFFF; color: #3A3A42';
let label = 'Câu ' + i + ', chưa trả lời';
if (i < cur[0] && !skipped.includes(i)) { st = 'border: 1px solid #A7E3C2; background: #ECFDF5; color: #047857'; label = 'Câu ' + i + ', đã trả lời'; }
if (flagged.includes(i)) { st = 'border: 2px dashed #B45309; background: #FFFBEB; color: #B45309'; label = 'Câu ' + i + ', đã đánh dấu xem lại'; }
if (cur.includes(i)) { st = 'border: 1px solid #059669; background: #059669; color: #FFFFFF'; label = 'Câu ' + i + ', đang làm'; }
cells.push({ n: i, style: base + st, label: label });
}
return { cells: cells };
}
}
</script>
</body>
</html>
