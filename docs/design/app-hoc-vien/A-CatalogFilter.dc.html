<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Android · Trang chủ, bộ lọc và sắp xếp</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./m3.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Be+Vietnam+Pro:wght@700&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div class="m3 {{theme}} safe-top" style="width: 390px; height: 844px">
<div style="display: contents; {{tones}}">
  <div class="bar between" style="padding: 0 4px 0 16px" aria-hidden="true">
    <h1 class="t-title">Chọn bài thi</h1>
    <div class="row">
      <span class="icon-btn"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></span>
      <span class="icon-btn"><span class="avatar" style="width: 32px; height: 32px; font-size: 13px">MA</span></span>
    </div>
  </div>
  <div class="col" aria-hidden="true" style="flex: none; padding-top: 8px">
    <div style="padding: 0 16px">
      <div class="tf">
        <label>Tìm theo tên hoặc mã</label>
        <svg viewBox="0 0 24 24" style="position: absolute; left: 14px; top: 16px; color: var(--on-surface-variant)"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" tabindex="-1" placeholder="Ví dụ: HSA FULL hoặc HSA-FULL-01" style="padding-left: 48px">
      </div>
    </div>
    <div class="row g8" style="padding: 12px 16px 0; overflow: hidden">
      <span style="flex: none; display: flex; align-items: center; height: 32px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--outline-variant); color: var(--on-surface-variant); font-size: 14px; font-weight: 500">Tất cả kỳ thi</span>
      <span style="flex: none; display: flex; align-items: center; height: 32px; padding: 0 16px; border-radius: 8px; background: var(--secondary-container); color: var(--on-secondary-container); font-size: 14px; font-weight: 500">HSA</span>
      <span style="flex: none; display: flex; align-items: center; height: 32px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--outline-variant); color: var(--on-surface-variant); font-size: 14px; font-weight: 500">TSA</span>
      <span style="flex: none; display: flex; align-items: center; height: 32px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--outline-variant); color: var(--on-surface-variant); font-size: 14px; font-weight: 500">V-ACT</span>
      <span style="flex: none; display: flex; align-items: center; height: 32px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--outline-variant); color: var(--on-surface-variant); font-size: 14px; font-weight: 500">THPT</span>
    </div>
    <div style="padding: 16px">
      <div class="card out" style="height: 300px"></div>
    </div>
  </div>

  <div aria-hidden="true" style="position: absolute; inset: 0; z-index: 2; background: var(--scrim); opacity: var(--scrim-o)"></div>

  <section class="col" role="dialog" aria-modal="true" aria-labelledby="a-flt-title" style="position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; background: var(--surface-container); border-radius: 28px 28px 0 0; padding: 0 16px 24px">
    <div style="display: flex; justify-content: center; padding: 16px 0 8px"><span aria-hidden="true" style="width: 32px; height: 4px; border-radius: 2px; background: var(--on-surface-variant); opacity: .4"></span></div>
    <div class="row between" style="min-height: 48px">
      <h2 id="a-flt-title" class="t-title" style="font-size: 20px">Tìm và lọc bài thi</h2>
      <button class="btn text">Xóa bộ lọc</button>
    </div>

    <h3 class="t-label" id="a-flt-format" style="margin: 8px 0 0; font-size: 14px; line-height: 20px; color: var(--on-surface)">Hình thức</h3>
    <div class="row" role="radiogroup" aria-labelledby="a-flt-format" style="flex-wrap: wrap; column-gap: 8px">
      <button role="radio" aria-checked="true" style="flex: none; height: 48px; border: 0; background: transparent; padding: 0; font: inherit; color: inherit"><span style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px 0 8px; border-radius: 8px; background: var(--secondary-container); color: var(--on-secondary-container); font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap"><svg viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><path d="m5 12 5 5 9-10"/></svg>Tất cả hình thức</span></button>
      <button role="radio" aria-checked="false" style="flex: none; height: 48px; border: 0; background: transparent; padding: 0; font: inherit; color: inherit"><span style="display: flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--outline-variant); color: var(--on-surface-variant); font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap">Bài thi FULL</span></button>
      <button role="radio" aria-checked="false" style="flex: none; height: 48px; border: 0; background: transparent; padding: 0; font: inherit; color: inherit"><span style="display: flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--outline-variant); color: var(--on-surface-variant); font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap">Bài thi theo phần</span></button>
      <button role="radio" aria-checked="false" style="flex: none; height: 48px; border: 0; background: transparent; padding: 0; font: inherit; color: inherit"><span style="display: flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--outline-variant); color: var(--on-surface-variant); font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap">Bài thi theo môn</span></button>
      <button role="radio" aria-checked="false" style="flex: none; height: 48px; border: 0; background: transparent; padding: 0; font: inherit; color: inherit"><span style="display: flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--outline-variant); color: var(--on-surface-variant); font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap">Bộ đề</span></button>
    </div>
    <p class="t-small" style="padding: 4px 0 8px"><span class="strong">Hình thức:</span> Bài thi FULL gồm các phần thi liên tiếp trong một lượt. Bài thi theo phần hoặc theo môn giúp bạn luyện riêng phần hoặc môn ghi trên thẻ.</p>

    <h3 class="t-label" id="a-flt-part" style="margin: 8px 0 0; font-size: 14px; line-height: 20px; color: var(--on-surface)">Phần/môn</h3>
    <div class="row" role="radiogroup" aria-labelledby="a-flt-part" style="flex-wrap: wrap; column-gap: 8px">
      <button role="radio" aria-checked="true" style="flex: none; height: 48px; border: 0; background: transparent; padding: 0; font: inherit; color: inherit"><span style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px 0 8px; border-radius: 8px; background: var(--secondary-container); color: var(--on-secondary-container); font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap"><svg viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><path d="m5 12 5 5 9-10"/></svg>Tất cả phần, môn</span></button>
      <button role="radio" aria-checked="false" style="flex: none; height: 48px; border: 0; background: transparent; padding: 0; font: inherit; color: inherit"><span style="display: flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--outline-variant); color: var(--on-surface-variant); font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap">Tư duy định lượng</span></button>
      <button role="radio" aria-checked="false" style="flex: none; height: 48px; border: 0; background: transparent; padding: 0; font: inherit; color: inherit"><span style="display: flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--outline-variant); color: var(--on-surface-variant); font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap">Tư duy định tính</span></button>
      <button role="radio" aria-checked="false" style="flex: none; height: 48px; border: 0; background: transparent; padding: 0; font: inherit; color: inherit"><span style="display: flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--outline-variant); color: var(--on-surface-variant); font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap">Khoa học</span></button>
      <button role="radio" aria-checked="false" style="flex: none; height: 48px; border: 0; background: transparent; padding: 0; font: inherit; color: inherit"><span style="display: flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--outline-variant); color: var(--on-surface-variant); font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap">Toán</span></button>
      <button role="radio" aria-checked="false" style="flex: none; height: 48px; border: 0; background: transparent; padding: 0; font: inherit; color: inherit"><span style="display: flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--outline-variant); color: var(--on-surface-variant); font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap">Ngữ văn</span></button>
      <button role="radio" aria-checked="false" style="flex: none; height: 48px; border: 0; background: transparent; padding: 0; font: inherit; color: inherit"><span style="display: flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--outline-variant); color: var(--on-surface-variant); font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap">Tiếng Anh</span></button>
      <button role="radio" aria-checked="false" style="flex: none; height: 48px; border: 0; background: transparent; padding: 0; font: inherit; color: inherit"><span style="display: flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--outline-variant); color: var(--on-surface-variant); font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap">Vật lý</span></button>
      <button role="radio" aria-checked="false" style="flex: none; height: 48px; border: 0; background: transparent; padding: 0; font: inherit; color: inherit"><span style="display: flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--outline-variant); color: var(--on-surface-variant); font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap">Hóa học</span></button>
      <button role="radio" aria-checked="false" style="flex: none; height: 48px; border: 0; background: transparent; padding: 0; font: inherit; color: inherit"><span style="display: flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--outline-variant); color: var(--on-surface-variant); font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap">Sinh học</span></button>
      <button role="radio" aria-checked="false" style="flex: none; height: 48px; border: 0; background: transparent; padding: 0; font: inherit; color: inherit"><span style="display: flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--outline-variant); color: var(--on-surface-variant); font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap">Lịch sử</span></button>
      <button role="radio" aria-checked="false" style="flex: none; height: 48px; border: 0; background: transparent; padding: 0; font: inherit; color: inherit"><span style="display: flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--outline-variant); color: var(--on-surface-variant); font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap">Địa lý</span></button>
    </div>

    <h3 class="t-label" id="a-flt-sort" style="margin: 16px 0 4px; font-size: 14px; line-height: 20px; color: var(--on-surface)">Sắp xếp</h3>
    <div class="seg" role="radiogroup" aria-labelledby="a-flt-sort" style="height: 48px; border-radius: 24px">
      <button role="radio" aria-checked="false" style="flex: 1 1 0; justify-content: center; padding: 0 8px">Mới công bố</button>
      <button role="radio" aria-checked="true" class="on" style="flex: 1 1 0; justify-content: center; padding: 0 8px">Giá tăng dần</button>
      <button role="radio" aria-checked="false" style="flex: 1 1 0; justify-content: center; padding: 0 8px">Giá giảm dần</button>
    </div>
  </section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const dark = this.props.dark ?? false;
return {
theme: dark ? 'dark' : 'light',
tones: dark ? '--scrim:var(--surface-lowest);--scrim-o:.7' : '--scrim:var(--on-surface);--scrim-o:.35'
};
}
}
</script>
</body>
</html>
