<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>iOS · Tài khoản</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./ios.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@700&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div class="ios {{theme}} safe-top" style="width: 390px; height: 844px">
  <div class="col pad grow g20" style="padding-top: 20px; padding-bottom: 104px">
    <h1 class="t-large">Tài khoản</h1>
    <div class="group">
      <div class="cell" style="padding: 12px 16px">
        <span class="avatar" style="width: 56px; height: 56px; border-radius: 28px; font-size: 20px" aria-hidden="true">MA</span>
        <span class="col grow g4">
          <span class="t-headline">Trần Minh Anh</span>
          <span class="t-foot">minhanh.tran · minhanh@example.com</span>
          <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>Email đã xác minh</span>
        </span>
      </div>
    </div>
    <div class="col">
      <h2 class="sec">Bảo mật</h2>
      <div class="group">
        <a class="cell" href="I-NewPassword.dc.html">
          <span class="tile"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M16 7l3 3"/></svg></span>
          <span class="grow">Đổi mật khẩu</span>
          <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
        </a>
        <div class="cell">
          <span class="tile"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M9 9v1.5M15 9v1.5M12 9v4h-1M9 15.5a4.5 4.5 0 0 0 6 0"/></svg></span>
          <span class="col grow">
            <span id="i-acc-bio">Mở khóa bằng Face ID</span>
            <span class="t-foot">Tự khóa sau 5 phút rời ứng dụng</span>
          </span>
          <button class="sw" role="switch" aria-checked="true" aria-labelledby="i-acc-bio"></button>
        </div>
      </div>
    </div>
    <div class="col">
      <h2 class="sec">Hiển thị</h2>
      <div class="group">
        <a class="cell" href="#">
          <span class="tile"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></span>
          <span class="grow">Ngôn ngữ</span>
          <span class="val">Tiếng Việt</span>
          <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
        </a>
        <div class="cell">
          <span class="tile"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
          <span class="grow" id="i-acc-theme">Giao diện</span>
          <span class="seg" role="group" aria-labelledby="i-acc-theme">
            <button class="on" aria-pressed="true">Sáng</button>
            <button aria-pressed="false">Tối</button>
          </span>
        </div>
      </div>
    </div>
    <div class="group">
      <a class="cell red" href="I-Login.dc.html">Đăng xuất</a>
    </div>
  </div>
  <nav class="tabbar" aria-label="Điều hướng chính">
    <a class="tab" href="I-Home.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>Trang chủ</a>
    <a class="tab" href="I-Home.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>Bài thi của tôi</a>
    <a class="tab" href="I-Home.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>Lịch sử</a>
    <a class="tab on" href="I-Account.dc.html" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Tài khoản</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { theme: (this.props.dark ?? false) ? 'dark' : 'light' };
}
}
</script>
</body>
</html>
