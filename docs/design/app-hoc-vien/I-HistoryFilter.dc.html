<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>iOS · Lịch sử, bộ lọc</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./ios.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@700&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div class="ios {{theme}}" style="width: 390px; height: 844px; {{statusVars}}">
  <div class="col safe-top" aria-hidden="true" style="position: absolute; inset: 0; filter: brightness(0.55); pointer-events: none">
    <div class="nav">
      <span style="width: 44px"></span>
      <span class="circle" style="background: transparent"><span class="avatar">MA</span></span>
    </div>
    <div class="col g12" style="padding: 0 16px 12px">
      <div class="row g8" style="padding: 0 4px">
        <span class="t-large" style="font-size: 30px; line-height: 36px">Lịch sử luyện thi</span>
        <span style="display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: 12px; font-size: 13px; font-weight: 600; background: var(--fill); color: var(--label2)">3 lượt</span>
      </div>
      <div class="row g8" style="height: 44px; border-radius: 12px; background: var(--fill); padding: 0 12px; color: var(--label2)">
        <svg viewBox="0 0 24 24" style="width: 18px; height: 18px"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span>Ví dụ: HSA tổng hợp</span>
      </div>
      <div class="row" style="flex-wrap: wrap; gap: 8px 6px">
        <span style="display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 16px; font-size: 14px; font-weight: 600; background: var(--tint-soft); color: var(--on-tint-soft)">Đánh giá năng lực ĐHQG Hà Nội (HSA)</span>
        <span style="display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 16px; font-size: 14px; font-weight: 600; background: var(--tint-soft); color: var(--on-tint-soft)">Bài thi theo phần</span>
        <span style="display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 16px; font-size: 14px; font-weight: 600; background: var(--tint-soft); color: var(--on-tint-soft)">01/11/2026 – 20/11/2026</span>
      </div>
    </div>
    <div class="col" style="padding: 12px 16px">
      <div class="group col g6" style="padding: 16px">
        <span class="t-headline" style="color: var(--tint)">HSA 2026 – Toán học và Xử lí số liệu</span>
        <span class="t-sub">Bài thi theo phần · Phần TOAN</span>
      </div>
    </div>
  </div>

  <section class="col" role="dialog" aria-modal="true" aria-labelledby="ihf-title" style="position: absolute; left: 0; right: 0; bottom: 0; top: 196px; background: var(--bg); border-radius: 32px 32px 0 0; box-shadow: var(--shadow); padding: 0 16px 34px">
    <div class="row" style="justify-content: center; height: 16px; align-items: flex-end" aria-hidden="true"><span style="width: 36px; height: 5px; border-radius: 3px; background: var(--sep)"></span></div>
    <div class="row between" style="height: 52px">
      <button class="btn text">Xóa bộ lọc</button>
      <a class="btn text" href="I-History.dc.html" style="font-weight: 600">Đóng</a>
    </div>
    <h2 id="ihf-title" class="t-title2" style="padding: 0 4px 16px">Lọc lịch sử luyện thi</h2>
    <div class="col g20">
      <div class="col">
        <label for="ihf-q" class="sec">Tìm theo tên bài</label>
        <div class="group">
          <div class="cell" style="gap: 8px; color: var(--label2)">
            <svg viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="ihf-q" type="search" value="" placeholder="Ví dụ: HSA tổng hợp" enterkeyhint="search" style="flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; color: var(--label); outline: none; padding: 0">
          </div>
        </div>
      </div>
      <div class="group">
        <button class="cell" aria-haspopup="menu" style="align-items: center">
          <span class="col grow">
            <span class="t-foot" style="font-weight: 600">Kỳ thi</span>
            <span style="color: var(--tint)">Đánh giá năng lực ĐHQG Hà Nội (HSA)</span>
          </span>
          <svg viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; color: var(--tint); stroke-width: 2.4"><path d="m8 9 4-4 4 4M8 15l4 4 4-4"/></svg>
        </button>
        <button class="cell" aria-haspopup="menu" style="align-items: center">
          <span class="col grow">
            <span class="t-foot" style="font-weight: 600">Phạm vi thi</span>
            <span style="color: var(--tint)">Bài thi theo phần</span>
          </span>
          <svg viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; color: var(--tint); stroke-width: 2.4"><path d="m8 9 4-4 4 4M8 15l4 4 4-4"/></svg>
        </button>
      </div>
      <div class="group">
        <div class="cell" style="padding-right: 4px">
          <span class="grow" id="ihf-from">Từ ngày</span>
          <button aria-labelledby="ihf-from" style="height: 34px; padding: 0 10px; border: 0; border-radius: 8px; font: inherit; background: var(--fill); color: var(--tint)">01/11/2026</button>
          <button class="circle" aria-label="Bỏ Từ ngày" style="background: transparent; color: var(--label2)"><svg viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/></svg></button>
        </div>
        <div class="cell" style="padding-right: 4px">
          <span class="grow" id="ihf-to">Đến ngày</span>
          <button aria-labelledby="ihf-to" style="height: 34px; padding: 0 10px; border: 0; border-radius: 8px; font: inherit; background: var(--fill); color: var(--tint)">20/11/2026</button>
          <button class="circle" aria-label="Bỏ Đến ngày" style="background: transparent; color: var(--label2)"><svg viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/></svg></button>
        </div>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const dark = this.props.dark ?? false;
return {
theme: dark ? 'dark' : 'light',
statusVars: dark ? '--succ: #34d399; --succ-bg: #0f2a21' : '--succ: #047857; --succ-bg: #ecfdf5'
};
}
}
</script>
</body>
</html>
