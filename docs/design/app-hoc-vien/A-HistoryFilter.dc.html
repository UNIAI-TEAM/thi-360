<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Android · Lịch sử, bộ lọc</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./m3.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Be+Vietnam+Pro:wght@700&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div class="m3 {{theme}}" style="width: 390px; height: 844px; {{statusVars}}">
  <div class="col safe-top" aria-hidden="true" style="position: absolute; inset: 0; filter: brightness(0.55); pointer-events: none">
    <div class="bar" style="padding: 0 12px 0 24px">
      <span class="t-title">Lịch sử luyện thi</span>
      <span class="chip" style="margin-left: 8px; background: var(--surface-high); color: var(--on-surface-variant)">3 lượt</span>
      <span class="grow"></span>
      <span class="icon-btn"><span class="avatar" style="width: 32px; height: 32px; font-size: 13px">MA</span></span>
    </div>
    <div class="col g12" style="padding: 8px 16px 12px">
      <div class="tf">
        <label>Tìm theo tên bài</label>
        <svg viewBox="0 0 24 24" style="position: absolute; left: 14px; top: 16px; color: var(--on-surface-variant)"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" value="" placeholder="Ví dụ: HSA tổng hợp" tabindex="-1" style="padding-left: 48px">
      </div>
      <div class="row" style="flex-wrap: wrap; gap: 8px 6px">
        <span class="chip" style="width: 40px; height: 32px; padding: 0; justify-content: center; background: transparent; border: 1px solid var(--outline); color: var(--on-surface)"><svg viewBox="0 0 24 24" style="width: 18px; height: 18px; stroke-width: 2"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg></span>
        <span class="chip" style="height: 32px; padding: 0 10px; font-size: 13px; background: var(--secondary-container); color: var(--on-secondary-container)">Đánh giá năng lực ĐHQG Hà Nội (HSA)</span>
        <span class="chip" style="height: 32px; padding: 0 10px; font-size: 13px; background: var(--secondary-container); color: var(--on-secondary-container)">Bài thi theo phần</span>
        <span class="chip" style="height: 32px; padding: 0 10px; font-size: 13px; background: var(--secondary-container); color: var(--on-secondary-container)">01/11/2026 – 20/11/2026</span>
      </div>
    </div>
    <div class="divider" style="margin: 0"></div>
    <div class="col g12" style="padding: 12px 16px">
      <article class="card out col g8">
        <span class="t-title-m" style="color: var(--primary)">HSA 2026 – Toán học và Xử lí số liệu</span>
        <div class="row g8"><span class="chip" style="background: var(--succ-bg); color: var(--succ)">Đã chấm</span><span class="t-small">Bài thi theo phần · Phần TOAN</span></div>
        <span class="t-small">Lần 1 · 21:05, 19/11/2026</span>
      </article>
    </div>
    <span class="grow"></span>
    <div class="navbar">
      <span class="nav-i"><span class="pill"><svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg></span>Trang chủ</span>
      <span class="nav-i"><span class="pill"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg></span>Bài thi của tôi</span>
      <span class="nav-i on"><span class="pill"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg></span>Lịch sử</span>
      <span class="nav-i"><span class="pill"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span>Tài khoản</span>
    </div>
  </div>

  <section class="col" role="dialog" aria-modal="true" aria-labelledby="ahf-title" style="position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface-container); border-radius: 28px 28px 0 0; padding: 0 16px 24px">
    <div class="row" style="justify-content: center; height: 36px" aria-hidden="true"><span style="width: 32px; height: 4px; border-radius: 2px; background: var(--outline)"></span></div>
    <div class="row between" style="padding: 0 0 16px 8px">
      <h2 id="ahf-title" class="t-title">Lọc lịch sử luyện thi</h2>
    </div>
    <div class="col g20">
      <div class="tf">
        <label for="ahf-q" style="background: var(--surface-container)">Tìm theo tên bài</label>
        <svg viewBox="0 0 24 24" aria-hidden="true" style="position: absolute; left: 14px; top: 16px; color: var(--on-surface-variant)"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="ahf-q" type="search" value="" placeholder="Ví dụ: HSA tổng hợp" enterkeyhint="search" style="padding-left: 48px">
      </div>
      <div class="tf trail">
        <label for="ahf-kind" style="background: var(--surface-container)">Kỳ thi</label>
        <input id="ahf-kind" type="text" readonly value="Đánh giá năng lực ĐHQG Hà Nội (HSA)" role="combobox" aria-expanded="false">
        <span class="icon-btn trail-btn" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></span>
      </div>
      <div class="col g8" role="radiogroup" aria-labelledby="ahf-scope">
        <span id="ahf-scope" class="t-label" style="padding-left: 4px">Phạm vi thi</span>
        <div class="row" style="flex-wrap: wrap; gap: 8px">
          <button class="chip" role="radio" aria-checked="false" style="height: 32px; padding: 0 12px; font-size: 14px; background: transparent; border: 1px solid var(--outline); color: var(--on-surface-variant)">Tất cả phạm vi</button>
          <button class="chip" role="radio" aria-checked="false" style="height: 32px; padding: 0 12px; font-size: 14px; background: transparent; border: 1px solid var(--outline); color: var(--on-surface-variant)">Bài thi FULL</button>
          <button class="chip" role="radio" aria-checked="true" style="height: 32px; padding: 0 12px 0 8px; font-size: 14px; border: 0; background: var(--secondary-container); color: var(--on-secondary-container)"><svg viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><path d="m5 12 5 5 9-10"/></svg>Bài thi theo phần</button>
          <button class="chip" role="radio" aria-checked="false" style="height: 32px; padding: 0 12px; font-size: 14px; background: transparent; border: 1px solid var(--outline); color: var(--on-surface-variant)">Bài thi theo môn</button>
        </div>
      </div>
      <div class="row g12">
        <div class="tf trail grow">
          <label for="ahf-from" style="background: var(--surface-container)">Từ ngày</label>
          <input id="ahf-from" type="text" readonly value="01/11/2026">
          <button class="icon-btn trail-btn" aria-label="Bỏ Từ ngày"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </div>
        <div class="tf trail grow">
          <label for="ahf-to" style="background: var(--surface-container)">Đến ngày</label>
          <input id="ahf-to" type="text" readonly value="20/11/2026">
          <button class="icon-btn trail-btn" aria-label="Bỏ Đến ngày"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </div>
      </div>
      <div class="row g12" style="padding-top: 4px">
        <button class="btn outlined grow">Xóa bộ lọc</button>
        <a class="btn filled grow" href="A-History.dc.html">Đóng</a>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const dark = this.props.dark ?? false;
return {
theme: dark ? 'dark' : 'light',
statusVars: dark
? '--succ: #34d399; --succ-bg: #0f2a21'
: '--succ: #047857; --succ-bg: #ecfdf5'
};
}
}
</script>
</body>
</html>
