<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>iPad · Đăng nhập</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./ios.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@700&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div class="ios {{theme}}" style="width: 1180px; height: 820px; padding: 24px">
  <div class="row end">
    <button class="circle" aria-label="Đổi ngôn ngữ"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></button>
  </div>
  <div class="col grow center" style="justify-content: center">
    <div class="group on-cell col g32" style="width: 480px; padding: 40px; border-radius: 32px; text-align: left; box-shadow: var(--shadow)">
      <div class="col g20">
        <div class="brand">
          <span class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-4-6.9"/><path d="m9 12 3 3 8-9"/></svg></span>
          <span class="wordmark">Thi 360</span>
        </div>
        <div class="col g4">
          <h1 class="t-large">Đăng nhập</h1>
          <p class="t-sub">Luyện thi đánh giá năng lực HSA và QDA</p>
        </div>
      </div>
      <div class="col g16">
        <div class="field">
          <label for="ip-login-id">Tên đăng nhập hoặc email</label>
          <input id="ip-login-id" type="text" value="minhanh.tran" autocomplete="username">
        </div>
        <div class="field trail focus">
          <label for="ip-login-pw">Mật khẩu</label>
          <input id="ip-login-pw" type="password" value="matkhau123" autocomplete="current-password">
          <button class="trail-btn" aria-label="Hiện mật khẩu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <div class="row end" style="margin-top: -8px"><a class="btn text" href="I-Forgot.dc.html">Quên mật khẩu?</a></div>
        <a class="btn prominent block" href="I-Pad-Account.dc.html">Đăng nhập</a>
      </div>
      <div class="row g4" style="justify-content: center">
        <span class="t-sub">Chưa có tài khoản?</span>
        <a class="btn text" href="I-Register.dc.html" style="font-weight: 600">Đăng ký</a>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
renderVals() {
return { theme: (this.props.dark ?? false) ? 'dark' : 'light' };
}
}
</script>
</body>
</html>
