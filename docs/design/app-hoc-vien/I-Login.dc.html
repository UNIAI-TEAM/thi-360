<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>iOS · Đăng nhập</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./ios.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@700&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div class="ios plain {{theme}} safe-top safe-bottom" style="width: 390px; height: 844px">
  <div class="nav">
    <span></span>
    <button class="circle" aria-label="Đổi ngôn ngữ"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></button>
  </div>
  <div class="col pad grow g32" style="padding-top: 28px">
    <div class="col g20">
      <div class="brand">
        <span class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-4-6.9"/><path d="m9 12 3 3 8-9"/></svg></span>
        <span class="wordmark">Thi 360</span>
      </div>
      <div class="col g4">
        <h1 class="t-large">Đăng nhập</h1>
        <p class="t-sub">Luyện thi đánh giá năng lực HSA và QDA</p>
      </div>
    </div>
    <div class="col g16">
      <sc-if value="{{ showError }}" hint-placeholder-val="{{ false }}">
        <div class="banner err" role="alert">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>
          <span>Tên đăng nhập hoặc mật khẩu không đúng.</span>
        </div>
      </sc-if>
      <div class="field">
        <label for="i-login-id">Tên đăng nhập hoặc email</label>
        <input id="i-login-id" type="text" value="minhanh.tran" autocomplete="username">
      </div>
      <div class="field trail focus">
        <label for="i-login-pw">Mật khẩu</label>
        <input id="i-login-pw" type="password" value="matkhau123" autocomplete="current-password">
        <button class="trail-btn" aria-label="Hiện mật khẩu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      <div class="row end" style="margin-top: -8px">
        <a class="btn text" href="I-Forgot.dc.html">Quên mật khẩu?</a>
      </div>
      <button class="btn prominent block">Đăng nhập</button>
    </div>
    <div class="grow"></div>
    <div class="row g4" style="justify-content: center; min-height: 44px">
      <span class="t-sub">Chưa có tài khoản?</span>
      <a class="btn text" href="I-Register.dc.html" style="font-weight: 600">Đăng ký</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"showError":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { theme: (this.props.dark ?? false) ? 'dark' : 'light', showError: this.props.showError ?? false };
}
}
</script>
</body>
</html>
