<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Android · Tài khoản</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./m3.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Be+Vietnam+Pro:wght@700&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div class="m3 {{theme}} safe-top" style="width: 390px; height: 844px">
  <div class="bar" style="padding: 0 24px">
    <h1 class="t-title" style="padding-left: 0">Tài khoản</h1>
  </div>
  <div class="col grow" style="overflow: hidden">
    <div class="pad" style="padding-top: 8px">
      <div class="card row g16">
        <span class="avatar lg" style="width: 56px; height: 56px; font-size: 20px" aria-hidden="true">MA</span>
        <div class="col grow g4">
          <span class="t-title-m">Trần Minh Anh</span>
          <span class="t-small">minhanh.tran · minhanh@example.com</span>
          <span><span class="chip"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>Email đã xác minh</span></span>
        </div>
      </div>
    </div>
    <h2 class="t-section">Bảo mật</h2>
    <a class="li" href="A-NewPassword.dc.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M16 7l3 3"/></svg>
      <span class="grow">Đổi mật khẩu</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
    </a>
    <div class="li">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 11v4a6 6 0 0 1-1.5 4"/><path d="M8 15v-4a4 4 0 0 1 8 0v3a10 10 0 0 1-1 4.5"/><path d="M5 17a12 12 0 0 0 .5-3.5V11a6.5 6.5 0 0 1 11-4.7"/><path d="M19 11v2a14 14 0 0 1-.4 3.4"/></svg>
      <span class="col grow">
        <span id="a-acc-bio">Mở khóa sinh trắc học</span>
        <span class="val">Tự khóa sau 5 phút rời ứng dụng</span>
      </span>
      <button class="sw" role="switch" aria-checked="true" aria-labelledby="a-acc-bio"></button>
    </div>
    <h2 class="t-section">Hiển thị</h2>
    <a class="li" href="#">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
      <span class="grow">Ngôn ngữ</span>
      <span class="val">Tiếng Việt</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
    </a>
    <div class="li">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span class="grow" id="a-acc-theme">Giao diện</span>
      <span class="seg" role="group" aria-labelledby="a-acc-theme">
        <button class="on" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>Sáng</button>
        <button aria-pressed="false">Tối</button>
      </span>
    </div>
    <div class="grow"></div>
    <div class="pad" style="padding-bottom: 16px">
      <a class="btn danger block" href="Main.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3M16 17l5-5-5-5M21 12H9"/></svg>Đăng xuất</a>
    </div>
  </div>
  <nav class="navbar" aria-label="Điều hướng chính">
    <a class="nav-i" href="A-Home.dc.html"><span class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg></span>Trang chủ</a>
    <a class="nav-i" href="A-Home.dc.html"><span class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg></span>Bài thi của tôi</a>
    <a class="nav-i" href="A-Home.dc.html"><span class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg></span>Lịch sử</a>
    <a class="nav-i on" href="A-Account.dc.html" aria-current="page"><span class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span>Tài khoản</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { theme: (this.props.dark ?? false) ? 'dark' : 'light' };
}
}
</script>
</body>
</html>
