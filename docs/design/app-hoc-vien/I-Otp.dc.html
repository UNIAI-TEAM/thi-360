<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>iOS · Đăng ký bước 2, nhập mã OTP</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./ios.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@700&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div class="ios plain {{theme}} safe-top safe-bottom" style="width: 390px; height: 844px">
  <div class="nav">
    <a class="circle" href="I-Register.dc.html" aria-label="Quay lại sửa thông tin"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></a>
    <span></span>
  </div>
  <div class="col pad grow g24" style="padding-top: 24px">
    <span class="hero-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span>
    <div class="col g8">
      <h1 class="t-large">Xác minh email</h1>
      <p class="t-body">Chúng tôi đã gửi mã 6 chữ số tới <span class="strong">minhanh@example.com</span>. Nhập mã bên dưới để tạo tài khoản.</p>
    </div>
    <div class="col g8">
      <div class="otp" role="group" aria-label="Mã xác minh">
        <input type="text" inputmode="numeric" maxlength="1" value="4" aria-label="Chữ số 1">
        <input type="text" inputmode="numeric" maxlength="1" value="0" aria-label="Chữ số 2">
        <input type="text" inputmode="numeric" maxlength="1" value="7" aria-label="Chữ số 3">
        <input type="text" inputmode="numeric" maxlength="1" value="1" aria-label="Chữ số 4">
        <input class="focus" type="text" inputmode="numeric" maxlength="1" value="" aria-label="Chữ số 5">
        <input type="text" inputmode="numeric" maxlength="1" value="" aria-label="Chữ số 6">
      </div>
      <span class="t-foot">Mã có hiệu lực trong 10 phút. Tài khoản chỉ được tạo sau khi bạn xác minh mã.</span>
    </div>
    <button class="btn prominent block">Xác minh</button>
    <div class="col center g4">
      <span class="t-sub">Chưa nhận được mã?</span>
      <span class="t-sub strong">Gửi lại mã sau 00:42</span>
    </div>
    <div class="grow"></div>
    <a class="btn text block" href="I-Register.dc.html">Quay lại sửa thông tin</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>

renderVals() {
return { theme: (this.props.dark ?? false) ? 'dark' : 'light' };
}
}
</script>
</body>
</html>
