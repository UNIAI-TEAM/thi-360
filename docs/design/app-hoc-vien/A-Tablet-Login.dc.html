<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Android · Tablet, Đăng nhập</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./m3.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Be+Vietnam+Pro:wght@700&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div class="m3 {{theme}}" style="width: 1280px; height: 800px; flex-direction: row">
  <div class="col g32" style="width: 560px; flex: none; padding: 64px 56px; background: var(--primary-container); color: var(--on-primary-container); justify-content: center">
    <div class="brand">
      <span class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-4-6.9"/><path d="m9 12 3 3 8-9"/></svg></span>
      <span class="wordmark">Thi 360</span>
    </div>
    <h2 class="t-display" style="font-weight: 500">Luyện thi đánh giá năng lực HSA và QDA</h2>
    <div class="col g16">
      <div class="row g12"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg><span>Thi thử theo đúng cấu trúc đề</span></div>
      <div class="row g12"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg><span>Biết điểm ngay sau khi nộp bài</span></div>
      <div class="row g12"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg><span>Xem lời giải và phần cần luyện thêm</span></div>
    </div>
  </div>
  <div class="col grow" style="padding: 24px">
    <div class="row end">
      <button class="icon-btn" aria-label="Đổi ngôn ngữ"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></button>
    </div>
    <div class="col grow g32" style="width: 400px; align-self: center; justify-content: center">
      <h1 class="t-display">Đăng nhập</h1>
      <div class="col g24">
        <div class="tf">
          <label for="at-login-id">Tên đăng nhập hoặc email</label>
          <input id="at-login-id" type="text" value="minhanh.tran" autocomplete="username">
        </div>
        <div class="col g4">
          <div class="tf trail focus">
            <label for="at-login-pw">Mật khẩu</label>
            <input id="at-login-pw" type="password" value="matkhau123" autocomplete="current-password">
            <button class="icon-btn trail-btn" aria-label="Hiện mật khẩu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
          <div class="row end"><a class="btn text" href="A-Forgot.dc.html">Quên mật khẩu?</a></div>
        </div>
        <a class="btn filled block" href="A-Tablet-Home.dc.html">Đăng nhập</a>
      </div>
      <div class="row g4" style="justify-content: center">
        <span class="t-small">Chưa có tài khoản?</span>
        <a class="btn text" href="A-Register.dc.html">Đăng ký</a>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return { theme: (this.props.dark ?? false) ? 'dark' : 'light' };
}
}
</script>
</body>
</html>
