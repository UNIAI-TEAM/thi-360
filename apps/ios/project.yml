name: Thi360
options:
  bundleIdPrefix: vn.unicom
  developmentLanguage: vi
  deploymentTarget:
    iOS: "18.0"
  defaultConfig: DevDebug
  groupSortPosition: top
  createIntermediateGroups: true

configs:
  DevDebug: debug
  DevRelease: release
  DemoDebug: debug
  DemoRelease: release

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    SWIFT_VERSION: "5.0"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES

packages:
  SwiftOpenAPIGenerator:
    url: https://github.com/apple/swift-openapi-generator
    from: 1.14.0
  SwiftOpenAPIRuntime:
    url: https://github.com/apple/swift-openapi-runtime
    from: 1.13.0
  SwiftOpenAPIURLSession:
    url: https://github.com/apple/swift-openapi-urlsession
    from: 1.4.0
  # IOS-RICH (UNI-2863): pinned formula engine (D-6, AC-724) and HTML parser (R-106)
  SwaTex:
    url: https://github.com/PhraseHQ/SwaTex.git
    exactVersion: 0.6.0
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    exactVersion: 2.9.6

targets:
  Thi360:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    configFiles:
      DevDebug: Config/Dev.xcconfig
      DevRelease: Config/Dev.xcconfig
      DemoDebug: Config/Demo.xcconfig
      DemoRelease: Config/Demo.xcconfig
    sources:
      - path: Thi360
        excludes:
          - Resources/Info-Dev.plist
          - Resources/Info-Demo.plist
          - Thi360.entitlements
      - path: ../../contracts/mobile/legal
        type: folder
        buildPhase: resources
    dependencies:
      - package: SwiftOpenAPIRuntime
        product: OpenAPIRuntime
      - package: SwiftOpenAPIURLSession
        product: OpenAPIURLSession
      # IOS-RICH (UNI-2863)
      - package: SwaTex
        product: SwaTex
      - package: SwaTex
        product: SwaTexRender
      - package: SwiftSoup
        product: SwiftSoup
    buildToolPlugins:
      - plugin: OpenAPIGenerator
        package: SwiftOpenAPIGenerator
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Thi360/Thi360.entitlements
        DEVELOPMENT_ASSET_PATHS: ""
        ENABLE_PREVIEWS: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Thi360 sử dụng Face ID để mở khóa ứng dụng nhanh và an toàn."
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        DevDebug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG THI360_DEV
        DevRelease:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: THI360_DEV
        DemoDebug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG THI360_DEMO
        DemoRelease:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: THI360_DEMO

  Thi360Tests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Thi360Tests
      # IOS-RICH (UNI-2863): read-only formula corpus, web renders, and HTML sample fixtures
      - path: ../../contracts/mobile/rich-text
        type: folder
        buildPhase: resources
      - path: ../../docs/specs/fixtures/rich-text-samples.json
        buildPhase: resources
    dependencies:
      - target: Thi360
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.unicom.thi360.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Thi360.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Thi360"
        BUNDLE_LOADER: "$(TEST_HOST)"
      configs:
        DevDebug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG THI360_DEV
        DevRelease:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: THI360_DEV
        DemoDebug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG THI360_DEMO
        DemoRelease:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: THI360_DEMO

  Thi360UITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Thi360UITests
    dependencies:
      - target: Thi360
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.unicom.thi360.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Thi360
      configs:
        DevDebug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG THI360_DEV
        DevRelease:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: THI360_DEV
        DemoDebug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG THI360_DEMO
        DemoRelease:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: THI360_DEMO

schemes:
  Thi360Dev:
    build:
      targets:
        Thi360: all
        Thi360Tests: [test]
        Thi360UITests: [test]
    run:
      config: DevDebug
    test:
      config: DevDebug
      targets:
        - Thi360Tests
        - Thi360UITests
    profile:
      config: DevRelease
    analyze:
      config: DevDebug
    archive:
      config: DevRelease

  Thi360Demo:
    build:
      targets:
        Thi360: all
        Thi360Tests: [test]
        Thi360UITests: [test]
    run:
      config: DemoDebug
    test:
      config: DemoDebug
      targets:
        - Thi360Tests
        - Thi360UITests
    profile:
      config: DemoRelease
    analyze:
      config: DemoDebug
    archive:
      config: DemoRelease
