name: Thi360
options:
  bundleIdPrefix: vn.unicom
  developmentLanguage: vi
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: DevDebug
  groupSortPosition: top
  createIntermediateGroups: true

configs:
  DevDebug: debug
  DevRelease: release
  DemoDebug: debug
  DemoRelease: release

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.0"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES

targets:
  Thi360:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    configFiles:
      DevDebug: Config/Dev.xcconfig
      DevRelease: Config/Dev.xcconfig
      DemoDebug: Config/Demo.xcconfig
      DemoRelease: Config/Demo.xcconfig
    sources:
      - path: Thi360
        excludes:
          - Resources/Info-Dev.plist
          - Resources/Info-Demo.plist
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: ""
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        DevDebug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG THI360_DEV
        DevRelease:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: THI360_DEV
        DemoDebug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG THI360_DEMO
        DemoRelease:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: THI360_DEMO

  Thi360Tests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Thi360Tests
    dependencies:
      - target: Thi360
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.unicom.thi360.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Thi360.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Thi360"
        BUNDLE_LOADER: "$(TEST_HOST)"
      configs:
        DevDebug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG THI360_DEV
        DevRelease:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: THI360_DEV
        DemoDebug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG THI360_DEMO
        DemoRelease:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: THI360_DEMO

  Thi360UITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Thi360UITests
    dependencies:
      - target: Thi360
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.unicom.thi360.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Thi360
      configs:
        DevDebug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG THI360_DEV
        DevRelease:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: THI360_DEV
        DemoDebug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG THI360_DEMO
        DemoRelease:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: THI360_DEMO

schemes:
  Thi360Dev:
    build:
      targets:
        Thi360: all
        Thi360Tests: [test]
        Thi360UITests: [test]
    run:
      config: DevDebug
    test:
      config: DevDebug
      targets:
        - Thi360Tests
        - Thi360UITests
    profile:
      config: DevRelease
    analyze:
      config: DevDebug
    archive:
      config: DevRelease

  Thi360Demo:
    build:
      targets:
        Thi360: all
        Thi360Tests: [test]
        Thi360UITests: [test]
    run:
      config: DemoDebug
    test:
      config: DemoDebug
      targets:
        - Thi360Tests
        - Thi360UITests
    profile:
      config: DemoRelease
    analyze:
      config: DemoDebug
    archive:
      config: DemoRelease
